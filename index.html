<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driving in the USA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#111; display:flex; justify-content:center; align-items:center; font-family:'Courier New',monospace; }

/* ── GameBoy body ── */
#gameboy {
  width:  min(100vw, calc(100vh * 0.565));
  height: min(100vh, calc(100vw / 0.565));
  background: linear-gradient(160deg, #d4cfb8 0%, #c4bfa8 60%, #b8b39e 100%);
  border-radius: 22px;
  box-shadow: inset 2px 3px 10px rgba(255,255,255,.55), inset -2px -3px 8px rgba(0,0,0,.25), 6px 10px 28px rgba(0,0,0,.65);
  display: flex; flex-direction: column;
  padding: 14px 14px 18px; gap: 10px;
  position: relative;
}

/* ── Screen wrapper ── */
#screen-wrapper {
  flex: 0 0 54%;
  background: #1e1e1e;
  border-radius: 14px;
  padding: 7px;
  box-shadow: inset 4px 4px 14px rgba(0,0,0,.85), inset -1px -1px 4px rgba(255,255,255,.08);
  position: relative; overflow: hidden;
  cursor: crosshair; touch-action: none;
}
#screen-wrapper::before {
  content:''; position:absolute; inset:5px; border-radius:9px; background:#0d1a0d; z-index:0;
}
#gameCanvas {
  width:100%; height:100%; display:block; border-radius:9px; position:relative; z-index:1;
  filter: sepia(.1) saturate(.9) brightness(.95);
}
#crosshair {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  color:rgba(190,215,190,.6); font-size:18px; font-weight:100; pointer-events:none; z-index:6;
  text-shadow:0 0 8px rgba(80,200,80,.3); line-height:1;
}

/* HUD */
#hud {
  position:absolute; top:9px; left:11px; right:11px;
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px;
  z-index:10; pointer-events:none;
  font-size:clamp(14px,3.6vw,20px);
  color:rgba(185,215,185,.92); text-shadow:0 0 6px rgba(0,220,0,.35); letter-spacing:.04em;
  line-height:1.1;
}
#track-bar {
  position:absolute; bottom:7px; left:9px; right:9px;
  z-index:10; pointer-events:none;
  font-size:clamp(16px,4.3vw,24px);
  color:rgba(170,210,170,.85); text-shadow:0 0 5px rgba(0,200,0,.3);
  white-space:normal; word-break:break-word;
  text-align:center; line-height:1.2;
}

/* Overlays inside screen */
#loading-screen, #start-overlay, #sound-panel {
  position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  border-radius:9px; padding:12px;
}
#loading-screen { background:rgba(10,20,10,.95); color:#8dc88d; font-size:clamp(9px,2.5vw,13px); gap:8px; }
#start-overlay  { background:rgba(8,15,8,.92); color:#aadaaa; gap:7px; }
#start-overlay h1 { font-size:clamp(11px,3vw,16px); color:#c8e8c8; letter-spacing:.05em; text-align:center; margin-bottom:2px; }
#start-overlay .ctrl-hint { font-size:clamp(6px,1.6vw,8.5px); color:#669966; text-align:center; line-height:1.6; }
.vol-row-sm { display:flex; align-items:center; gap:6px; width:100%; }
.vol-row-sm label { font-size:clamp(6px,1.5vw,8px); color:#88aa88; min-width:4em; text-align:right; }
.vol-row-sm input[type=range] { flex:1; accent-color:#6a8; height:14px; cursor:pointer; }
.vol-row-sm span { font-size:clamp(6px,1.5vw,8px); color:#99bb99; min-width:2.5em; }
#audio-load-msg { font-size:clamp(6px,1.5vw,8px); color:#557755; text-align:center; }
#start-btn {
  margin-top:4px; padding:6px 18px;
  background:transparent; color:#aaddaa; border:1px solid #446644;
  font-family:inherit; font-size:clamp(9px,2.3vw,13px); cursor:pointer; letter-spacing:.05em;
  border-radius:4px;
}
#start-btn:disabled { opacity:.4; cursor:default; }
#start-btn:not(:disabled):active { background:rgba(100,180,100,.15); }

/* Sound panel */
#sound-panel { background:rgba(8,15,8,.95); z-index:18; display:none; gap:8px; }
#sound-panel h2 { font-size:clamp(8px,2vw,11px); color:#99cc99; }
.sound-close { margin-top:6px; padding:4px 14px; background:transparent; color:#88aa88; border:1px solid #446644; font-family:inherit; font-size:clamp(7px,1.8vw,10px); cursor:pointer; border-radius:3px; }

/* Now-playing / connecting bar */
#connecting-bar {
  position:absolute; top:25%; left:9px; right:9px;
  z-index:10; pointer-events:none;
  font-size:clamp(24px,6vw,34px);
  font-weight:bold;
  color:rgba(155,200,155,.9);
  text-align:center; display:none;
  white-space:normal; word-break:break-word; line-height:1.2;
}

/* ── Controls area ── */
#controls { flex:1; display:flex; flex-direction:column; gap:8px; }
#controls-mid { flex:1; display:flex; align-items:stretch; gap:8px; }

/* D-pad housing */
#dpad-housing {
  align-self:center; height:75%; aspect-ratio:1; flex-shrink:0; max-width:210px;
  background:linear-gradient(160deg,#d4cfb8 0%,#c4bfa8 60%,#b8b39e 100%);
  border-radius:18px; padding:9%;
  box-shadow: inset 4px 4px 12px rgba(0,0,0,.5), inset -2px -2px 6px rgba(255,255,255,.2);
}
#dpad { width:100%; height:100%; display:grid; grid-template-columns:1fr 1.1fr 1fr; grid-template-rows:1fr 1.1fr 1fr; gap:2px; }
.dpad-btn {
  background:linear-gradient(145deg,#2a2a2a,#111); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .08s, box-shadow .08s;
  box-shadow:1px 1px 3px rgba(0,0,0,.5), -1px -1px 2px rgba(255,255,255,.08);
}
.dpad-btn.pressed, .dpad-btn:active { background:linear-gradient(145deg,#111,#2a2a2a); box-shadow:inset 2px 2px 5px rgba(0,0,0,.7); }
.dpad-arrow { color:#888; font-size:clamp(11px,3.5vw,18px); pointer-events:none; }
#dpad-up     { grid-area:1/2; border-radius:5px 5px 2px 2px; }
#dpad-left   { grid-area:2/1; border-radius:5px 2px 2px 5px; }
#dpad-center { grid-area:2/2; border-radius:4px; background:#1a1a1a; }
#dpad-right  { grid-area:2/3; border-radius:2px 5px 5px 2px; }
#dpad-down   { grid-area:3/2; border-radius:2px 2px 5px 5px; }
#dpad-corner-tl { grid-area:1/1; background:transparent!important; box-shadow:none!important; }
#dpad-corner-tr { grid-area:1/3; background:transparent!important; box-shadow:none!important; }
#dpad-corner-bl { grid-area:3/1; background:transparent!important; box-shadow:none!important; }
#dpad-corner-br { grid-area:3/3; background:transparent!important; box-shadow:none!important; }

/* Sliders */
#sliders-area { flex:1; display:flex; flex-direction:column; gap:6px; justify-content:center; }
.slider-panel {
  background:linear-gradient(160deg,#b8b49e,#a8a490); border-radius:12px; padding:5px 10px 4px;
  box-shadow:inset 3px 3px 7px rgba(0,0,0,.28), inset -1px -1px 3px rgba(255,255,255,.32);
}
.tick-row { height:8px; padding:0 2px; margin-bottom:2px; background:repeating-linear-gradient(to right,#888 0px,#888 1px,transparent 1px,transparent 7px); background-size:calc(100%/13) 100%; }
#lr-panel { position:relative; }
#lr-panel::after { content:''; position:absolute; left:50%; top:4px; bottom:4px; width:3px; background:#555; transform:translateX(-50%); border-radius:2px; pointer-events:none; }
input[type=range] { width:100%; height:22px; -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track { height:5px; background:linear-gradient(to right,#666,#777); border-radius:3px; box-shadow:inset 1px 1px 4px rgba(0,0,0,.5); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; background:linear-gradient(145deg,#555,#1e1e1e); border-radius:5px; margin-top:-10px; box-shadow:2px 2px 6px rgba(0,0,0,.55), -1px -1px 2px rgba(255,255,255,.18); }
input[type=range]::-moz-range-track { height:5px; background:#666; border-radius:3px; }
input[type=range]::-moz-range-thumb { width:26px; height:26px; background:linear-gradient(145deg,#555,#1e1e1e); border-radius:5px; border:none; }
.slider-label { text-align:center; font-size:clamp(7px,1.8vw,9px); color:#5a5848; letter-spacing:.05em; margin-top:1px; }

/* Bottom buttons */
#buttons-row { display:flex; justify-content:space-around; align-items:flex-start; padding:0 2px; }
.action-btn-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
.action-btn {
  width:clamp(38px,12.5vw,54px); height:clamp(38px,12.5vw,54px); border-radius:50%; border:none;
  background:linear-gradient(145deg,#2e2e2e,#111);
  box-shadow:3px 3px 8px rgba(0,0,0,.55), -1px -1px 3px rgba(255,255,255,.12), inset 1px 1px 2px rgba(255,255,255,.08);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .1s; color:#888;
}
.action-btn:active { box-shadow:inset 2px 2px 7px rgba(0,0,0,.7); transform:scale(.94); }
.action-btn.active { color:#6aba6a; }
.action-btn svg { width:44%; height:44%; }
.btn-label { font-size:clamp(5.5px,1.5vw,8.5px); color:#5a5848; text-align:center; white-space:nowrap; }
</style>
</head>
<body>

<!-- ── GameBoy ── -->
<div id="gameboy">

  <!-- Screen -->
  <div id="screen-wrapper">
    <!-- Loading -->
    <div id="loading-screen">
      <div>ロード中...</div>
      <div id="load-progress" style="font-size:clamp(6px,1.5vw,8px);color:#557755;"></div>
    </div>
    <!-- Title overlay -->
    <div id="start-overlay" style="display:none">
      <h1>Driving in the USA</h1>
      <div id="audio-load-msg">読み込み中・・・</div>
      <button id="start-btn" disabled>DRIVE START</button>
    </div>
    <!-- Sound settings panel -->
    <div id="sound-panel">
      <h2>── 音量設定 ──</h2>
      <div class="vol-row-sm">
        <label>エンジン</label>
        <input type="range" id="engine-vol2" min="0" max="100" value="70">
        <span id="engine-vol2-lbl">70%</span>
      </div>
      <div class="vol-row-sm">
        <label>Music</label>
        <input type="range" id="yt-vol2" min="0" max="100" value="70">
        <span id="yt-vol2-lbl">70%</span>
      </div>
      <div id="now-playing2" style="font-size:clamp(6px,1.5vw,8px);color:#669966;text-align:center;margin-top:2px;"></div>
      <button class="sound-close" id="sound-close">閉じる</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="crosshair">+</div>
    <div id="hud">
      <span><span id="hud-speed">0</span>km/h</span>
      <span id="hud-auto" style="display:none;color:#6aba6a;">AUTO</span>
      <span id="hud-coords" style="opacity:.7"></span>
    </div>
    <div id="track-bar"></div>
    <div id="connecting-bar"></div>
  </div><!-- /screen-wrapper -->

  <!-- Controls -->
  <div id="controls">
    <div id="controls-mid">
      <!-- D-pad -->
      <div id="dpad-housing">
        <div id="dpad">
          <div id="dpad-corner-tl"></div>
          <div id="dpad-up"     class="dpad-btn" data-dir="up">   <span class="dpad-arrow">▲</span></div>
          <div id="dpad-corner-tr"></div>
          <div id="dpad-left"   class="dpad-btn" data-dir="left"> <span class="dpad-arrow">◀</span></div>
          <div id="dpad-center" class="dpad-btn" data-dir="center"><span class="dpad-arrow" style="color:#555">●</span></div>
          <div id="dpad-right"  class="dpad-btn" data-dir="right"><span class="dpad-arrow">▶</span></div>
          <div id="dpad-corner-bl"></div>
          <div id="dpad-down"   class="dpad-btn" data-dir="down"> <span class="dpad-arrow">▼</span></div>
          <div id="dpad-corner-br"></div>
        </div>
      </div>
      <!-- Sliders -->
      <div id="sliders-area">
        <div class="slider-panel" id="lr-panel">
          <div class="tick-row"></div>
          <input type="range" id="lr-slider" min="-100" max="100" value="0">
          <div class="slider-label">左右操作</div>
        </div>
        <div class="slider-panel">
          <div class="tick-row"></div>
          <input type="range" id="speed-slider" min="0" max="100" value="0">
          <div class="slider-label">スピード</div>
        </div>
      </div>
    </div><!-- /controls-mid -->

    <!-- Bottom buttons -->
    <div id="buttons-row">
      <div class="action-btn-wrap">
        <button class="action-btn active" id="btn-play">
          <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <span class="btn-label">再生・停止</span>
      </div>
      <div class="action-btn-wrap">
        <button class="action-btn active" id="btn-hud">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <span class="btn-label">表示・非表示</span>
      </div>
      <div class="action-btn-wrap">
        <button class="action-btn" id="btn-auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="7" rx="2"/>
            <path d="M5 11l2-5h10l2 5"/>
            <circle cx="7.5" cy="15.5" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="16.5" cy="15.5" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <span class="btn-label">自動運転</span>
      </div>
      <div class="action-btn-wrap">
        <button class="action-btn active" id="btn-sound">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3z"/>
            <path d="M16.5 12A4.5 4.5 0 0014 7.97v8.06c1.48-.73 2.5-2.25 2.5-4.03z" opacity=".7"/>
          </svg>
        </button>
        <span class="btn-label">音量設定</span>
      </div>
      <div class="action-btn-wrap">
        <button class="action-btn" id="btn-fs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M3 16v3a2 2 0 002 2h3"/>
          </svg>
        </button>
        <span class="btn-label">全画面</span>
      </div>
    </div>
  </div>
</div><!-- /gameboy -->

<!-- YouTube player (off-screen) -->
<div style="position:fixed;top:-400px;left:-400px;width:400px;height:300px;pointer-events:none">
  <div id="yt-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ─────────────────────────────────────────────
//  DOM REFS
// ─────────────────────────────────────────────
const canvas       = document.getElementById('gameCanvas');
const wrapper      = document.getElementById('screen-wrapper');
const loadingEl    = document.getElementById('loading-screen');
const loadProgEl   = document.getElementById('load-progress');
const startOverlay = document.getElementById('start-overlay');
const connectBar   = document.getElementById('connecting-bar');
const trackBarEl   = document.getElementById('track-bar');
const hudEl        = document.getElementById('hud');
const hudSpeedEl   = document.getElementById('hud-speed');
const hudAutoEl    = document.getElementById('hud-auto');
const soundPanel   = document.getElementById('sound-panel');

// ─────────────────────────────────────────────
//  CONSTANTS (matching original)
// ─────────────────────────────────────────────
const EYE_HEIGHT   = 0.27;
const MAX_CRUISE   = 22;
const PLAYER_R     = 0.3;
const PLAY_X_MIN   = -21.1, PLAY_X_MAX = 21.1;
const PLAY_Z_MIN   = -233,  PLAY_Z_MAX = 1;
const LOOP_LENGTH  = 234;
const AP_TARGET_X  = 1.17;
const ONCOMING_X   =  1.17;
const SAMEDIR_X    = -1.17;
const CAR_SPEED    = MAX_CRUISE / 2;
const CYCLE_DURATION_MS   = 35 * 60 * 1000;
const SPAWN_WINDOW_MS     = 30000;
const SAMEDIR_LIFETIME_MS = 180000;
const CAR_SPAWN_OFFSET_ABS = 100;
const SAMEDIR_EXIT_DIST    = CAR_SPAWN_OFFSET_ABS + LOOP_LENGTH / 2;

// ─────────────────────────────────────────────
//  RENDERER
// ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;

function onResize() {
  const W = wrapper.clientWidth, H = wrapper.clientHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// ─────────────────────────────────────────────
//  SCENE
// ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.FogExp2(0xc8daf0, 0.0075);

// Sky gradient shader (same as original)
const skyUniforms = {
  topColor:         { value: new THREE.Color(0x4a6fa0) },
  horizonColor:     { value: new THREE.Color(0xc8daf0) },
  horizonBandColor: { value: new THREE.Color(0xc8daf0) },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  vertexShader:   `varying vec3 vPos; void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 topColor,horizonColor,horizonBandColor; varying vec3 vPos;
    void main(){ float h=clamp(normalize(vPos).y,0.0,1.0); float b=smoothstep(0.0,0.11,h);
      vec3 lo=mix(horizonBandColor,horizonColor,b); gl_FragColor=vec4(mix(lo,topColor,pow(h,0.6)),1.0); }`,
  side: THREE.BackSide, depthWrite: false, depthTest: false,
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(490,32,15), skyMat);
skyMesh.renderOrder = -1; skyMesh.frustumCulled = false;
scene.add(skyMesh);

let skyTopTarget       = new THREE.Color(0x4a6fa0);
let skyHorizTarget     = new THREE.Color(0xc8daf0);
let skyHorizBandTarget = new THREE.Color(0xc8daf0);
let skyIsBlack = false;

function setSkyFromColor(hex, solid = false) {
  skyIsBlack = hex.toLowerCase() === '#000000';
  const base = new THREE.Color(hex);
  skyTopTarget.copy(base).multiplyScalar(0.42);
  skyHorizTarget = solid ? skyTopTarget.clone() : base.clone().lerp(new THREE.Color(0xddd8c8), 0.52);
  skyHorizBandTarget.copy(skyHorizTarget);
}
function setSkyHorizBand(hex) {
  if (hex) skyHorizBandTarget.set(hex); else skyHorizBandTarget.copy(skyHorizTarget);
}
setSkyFromColor('#9bbae8');

// ─────────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(70, 1, 0.01, 500);
camera.rotation.order = 'YXZ';
camera.position.set(0, EYE_HEIGHT, -5);

// ─────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(50, 100, 50);
scene.add(sun);

// ─────────────────────────────────────────────
//  GROUND
// ─────────────────────────────────────────────
const extDesertPlane = (() => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1200,1200), new THREE.MeshLambertMaterial({ color:0xf0e3b9 }));
  m.rotation.x = -Math.PI/2; m.position.set(0,-0.05,-116); m.frustumCulled = false;
  scene.add(m); return m;
})();

// ─────────────────────────────────────────────
//  RAIN
// ─────────────────────────────────────────────
let rainActive = false;
{
  const CNT=5000, SPR=5, TOP=10, SPD=0.3, LEN=0.2;
  const pos = new Float32Array(CNT*6);
  for (let i=0;i<CNT;i++){
    const x=(Math.random()-.5)*SPR*2, y=Math.random()*TOP, z=(Math.random()-.5)*SPR*2, b=i*6;
    pos[b]=x;pos[b+1]=y;pos[b+2]=z;pos[b+3]=x;pos[b+4]=y-LEN;pos[b+5]=z;
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var rainSystem=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xaaccff,transparent:true,opacity:1,depthWrite:false}));
  rainSystem.visible=false; rainSystem.frustumCulled=false; scene.add(rainSystem);
  window._updateRain=function(){
    rainSystem.visible=rainActive; if(!rainActive)return;
    const p=rainSystem.geometry.attributes.position.array;
    for(let i=0;i<CNT;i++){const b=i*6;p[b+1]-=SPD;p[b+4]-=SPD;
      if(p[b+4]<-1){const x=(Math.random()-.5)*SPR*2,z=(Math.random()-.5)*SPR*2,y=TOP+Math.random()*4;p[b]=x;p[b+1]=y;p[b+2]=z;p[b+3]=x;p[b+4]=y-LEN;p[b+5]=z;}}
    rainSystem.geometry.attributes.position.needsUpdate=true;
    rainSystem.position.set(camera.position.x,0,camera.position.z);
  };

function buildMountainRings() {
  function makeTex(seed,color,rs=1){
    const W=2048,H=512,cv=document.createElement('canvas'); cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d'); ctx.clearRect(0,0,W,H);
    const prof=new Float32Array(W+1);
    for(let x=0;x<=W;x++){const t=x/W*Math.PI*2;let h=0;h+=.30*Math.sin(t*3+seed);h+=.20*Math.sin(t*7+seed*1.3);h+=.10*Math.sin(t*13+seed*.7);h+=.05*Math.sin(t*23+seed*2.1);h+=.03*Math.sin(t*41+seed*1.7);prof[x]=h;}
    const mn=Math.min(...prof),mx=Math.max(...prof);
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x++){const n=(prof[x]-mn)/(mx-mn);ctx.lineTo(x,H*(.60+(1-n)*.38*rs));}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    return new THREE.CanvasTexture(cv);
  }
  const layers=[{r:150,h:90,cy:15,color:'#8a7860',seed:1.2,rs:37/90},{r:260,h:95,cy:17,color:'#7a7890',seed:2.7,rs:43/95},{r:400,h:100,cy:20,color:'#9898b0',seed:4.1,rs:53/100}];
  return layers.map(L=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(L.r,L.r,L.h,64,1,true),
      new THREE.MeshBasicMaterial({map:makeTex(L.seed,L.color,L.rs),side:THREE.BackSide,transparent:true,alphaTest:.05,depthWrite:false,fog:false}));
    m.position.y=L.cy; m.frustumCulled=false; scene.add(m); return m;
  });
}

function addRocks(){

  for(let i=0;i<3000;i++){

    const r=rng(.02,.0875),sx=rng(.7,1.3),sy=rng(.4,.85),sz=rng(.7,1.3);
    const rx=rng(0,Math.PI),ry=rng(0,Math.PI),rz=rng(0,Math.PI),ci=Math.floor(Math.random()*4);
    const zones=getRockZones(wx,wz);
    for(const dz of[0,-LOOP_LENGTH]){
      const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),new THREE.MeshLambertMaterial({color:colors[ci]}));
      rock.scale.set(sx,sy,sz);rock.rotation.set(rx,ry,rz);rock.position.set(wx,r*sy*.45,wz+dz);

let playerZDeltaFrame=0;
function updateAllTrafficCars(dt){
  if(!gameStartTime)return;
  const elapsed=getElapsedMs();
  let ce=elapsed-cycleStartElapsed;
  if(ce>=CYCLE_DURATION_MS){cycleStartElapsed+=CYCLE_DURATION_MS;ce-=CYCLE_DURATION_MS;resetTrafficCars();return;}
  for(const tc of trafficCars){
    if(!tc.mesh)continue;
    if(!tc.active&&!tc.done&&ce>=tc.spawnAt){
      if(ce-tc.spawnAt>SPAWN_WINDOW_MS){tc.done=true;}
      else{
        const sx=tc.oncoming?ONCOMING_X:SAMEDIR_X;
        let sz=camera.position.z-100;
        if(tc.oncoming)sz=Math.max(sz,PLAY_Z_MIN); else if(sz<PLAY_Z_MIN)sz+=LOOP_LENGTH;
        tc.mesh.position.set(sx,0,sz);tc.mesh.rotation.y=tc.oncoming?Math.PI:0;
        tc.mesh.visible=true;tc.active=true;tc.spawnElapsed=ce;tc.relDist=0;
      }
    }
    if(!tc.active)continue;
    if(ce-tc.spawnElapsed>=tc.lifetime){tc.mesh.visible=false;tc.active=false;tc.done=true;continue;}
    if(tc.oncoming){
      tc.mesh.position.z+=CAR_SPEED*dt;
      if(tc.mesh.position.z>=PLAY_Z_MAX){tc.mesh.visible=false;tc.active=false;tc.done=true;}
    } else {
      tc.mesh.position.z-=CAR_SPEED*dt;
      if(tc.mesh.position.z<PLAY_Z_MIN)tc.mesh.position.z+=LOOP_LENGTH;
      tc.relDist+=playerZDeltaFrame-CAR_SPEED*dt;
      if(tc.relDist>=SAMEDIR_EXIT_DIST){tc.mesh.visible=false;tc.active=false;tc.done=true;}
    }
  }
}

function loadSpecialModel(file,px,py,pz){

        const fix=mat=>{if(!mat)return;if(mat.color&&mat.color.r>.6&&mat.color.g<.35&&mat.color.b>.5){c.visible=false;return;}mat.transparent=false;mat.opacity=1;mat.depthWrite=true;mat.needsUpdate=true;};
        Array.isArray(c.material)?c.material.forEach(fix):fix(c.material);});
      m.scale.set(.4,.4,.4);m.position.set(px,py,pz);m.visible=false;scene.add(m);
      const mc=m.clone();mc.position.set(px,py,pz-LOOP_LENGTH);mc.visible=false;scene.add(mc);
      resolve({main:m,copy:mc});
    },null,e=>{console.error(file,e);resolve(null);});
  });
}

// ─────────────────────────────────────────────
const audioLoadMsg=document.getElementById('audio-load-msg');
const startBtn=document.getElementById('start-btn');
(async()=>{
  try {
    audioLoadMsg.textContent='読み込み中・・・';
    const ab1=await fetch('music/drive_on_freeway1.mp3').then(r=>r.arrayBuffer());
    audioBufs['freeway1']=await audioCtx.decodeAudioData(ab1);
    audioLoadMsg.style.display='none';
    startBtn.disabled=false; startBtn.style.opacity=''; startBtn.style.cursor='';
    const ab2=await fetch('music/drive_on_freeway2.mp3').then(r=>r.arrayBuffer());
    audioBufs['freeway2']=await audioCtx.decodeAudioData(ab2);
  } catch(e){
    audioLoadMsg.textContent='音声の読み込みに失敗しました。再読み込みしてください。';
    audioLoadMsg.style.color='#f88';
    startBtn.disabled=false; startBtn.style.opacity=''; startBtn.style.cursor='';
  }
})();

loadPlaylist().then(()=>initYTPlayer()).catch(console.error);

// ─────────────────────────────────────────────
//  MOBILE INPUT STATE
// ─────────────────────────────────────────────
let yaw=0, pitch=0, pitchShake=0, shakePhase=0, shakeT0=performance.now();
let touchActive=false, touchLastX=0, touchLastY=0;
let gameActive=false, autoPilot=false;
let cruiseSpeed=0;
let displayMode=0; // 0=full, 1=hide hud

// Sliders
const lrSlider    = document.getElementById('lr-slider');
const speedSlider = document.getElementById('speed-slider');
const ytVolSlider  = document.getElementById('yt-vol2');
const engVolSlider = document.getElementById('engine-vol2');

// lrSlider value is read each frame in the animation loop (rate-based steering)
speedSlider.addEventListener('input',e=>{ if(gameActive) cruiseSpeed=+e.target.value/100*MAX_CRUISE; });

engVolSlider.addEventListener('input',e=>{
  masterGain.gain.value=e.target.value/100;
  document.getElementById('engine-vol2-lbl').textContent=e.target.value+'%';
});
ytVolSlider.addEventListener('input',e=>{
  baseVol=parseInt(e.target.value); applyVolAdj();
});

// Touch drag on game screen → camera yaw/pitch
wrapper.addEventListener('touchstart',e=>{
  if(e.target.closest('#start-overlay,#sound-panel,#loading-screen'))return;
  if(e.touches.length===1){touchActive=true;touchLastX=e.touches[0].clientX;touchLastY=e.touches[0].clientY;}
},{passive:true});
wrapper.addEventListener('touchmove',e=>{
  if(!touchActive||e.touches.length!==1)return;
  const dx=e.touches[0].clientX-touchLastX, dy=e.touches[0].clientY-touchLastY;
  touchLastX=e.touches[0].clientX; touchLastY=e.touches[0].clientY;
  yaw-=dx*0.003; pitch-=dy*0.002;
  pitch=Math.max(-1.3,Math.min(1.3,pitch));
},{passive:true});
wrapper.addEventListener('touchend',()=>{touchActive=false;});
wrapper.addEventListener('touchcancel',()=>{touchActive=false;});
// Mouse drag (desktop)
let mouseDown=false,mouseLastX=0,mouseLastY=0;
wrapper.addEventListener('mousedown',e=>{if(e.target===canvas||e.target===document.getElementById('crosshair')){mouseDown=true;mouseLastX=e.clientX;mouseLastY=e.clientY;}});
window.addEventListener('mouseup',()=>{mouseDown=false;});
window.addEventListener('mousemove',e=>{
  if(!mouseDown)return;
  yaw-=(e.clientX-mouseLastX)*0.003;pitch-=(e.clientY-mouseLastY)*0.002;
  pitch=Math.max(-1.3,Math.min(1.3,pitch));
  mouseLastX=e.clientX;mouseLastY=e.clientY;
});

// D-pad
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const dir=btn.dataset.dir; if(!dir)return;
  const press=()=>{
    btn.classList.add('pressed');
    if(dir==='up'){selectTrack(-1);}
    else if(dir==='down'){selectTrack(+1);}
    else if(dir==='left'){seekYT(-10);}
    else if(dir==='right'){seekYT(+10);}
    else if(dir==='center'){if(isBrowsing)confirmTrack();else toggleYt();}
  };
  const release=()=>btn.classList.remove('pressed');
  btn.addEventListener('mousedown',press);
  btn.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});
  btn.addEventListener('mouseup',release);btn.addEventListener('mouseleave',release);
  btn.addEventListener('touchend',release);btn.addEventListener('touchcancel',release);
});

// ─────────────────────────────────────────────
//  BUTTONS
// ─────────────────────────────────────────────
const btnPlay  =document.getElementById('btn-play');
const btnHud   =document.getElementById('btn-hud');
const btnAuto  =document.getElementById('btn-auto');
const btnSoundBtn=document.getElementById('btn-sound');
const btnFs    =document.getElementById('btn-fs');

// Music play state (independent of engine BGM)
let musicPlaying=false;
function clearNowPlaying(){
  trackBarEl.textContent='';
  connectBar.style.display='none';
}
function setMusicBtn(playing){
  musicPlaying=playing;
  btnPlay.classList.toggle('active',!playing);
  document.getElementById('play-icon').innerHTML=playing
    ?'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    :'<path d="M8 5v14l11-7z"/>';
}

btnPlay.addEventListener('click',()=>{
  if(isBrowsing){ confirmTrack(); return; }
  if(radioActive){
    radioAudio.paused ? radioAudio.play().catch(console.error) : radioAudio.pause();
    return;
  }
  if(!ytReady||!ytPlayer) return;
  ytPlayer.getPlayerState()===1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
});

btnHud.addEventListener('click',()=>{
  displayMode=(displayMode+1)%2;
  const hide=displayMode===1;
  hudEl.style.visibility=hide?'hidden':'';
  trackBarEl.style.visibility=hide?'hidden':'';
  connectBar.style.visibility=hide?'hidden':'';
  btnHud.classList.toggle('active',displayMode===0);
});

btnAuto.addEventListener('click',()=>{
  autoPilot=!autoPilot;
  btnAuto.classList.toggle('active',autoPilot);
  hudAutoEl.style.display=autoPilot?'':'none';
});

btnSoundBtn.addEventListener('click',()=>{
  soundPanel.style.display='flex';
});
document.getElementById('sound-close').addEventListener('click',()=>{
  soundPanel.style.display='none';
});

btnFs.addEventListener('click',()=>{
  if(!document.fullscreenElement){
    (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)?.call(document.documentElement);
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
  }
  btnFs.classList.toggle('active');
});

// DRIVE START
startBtn.addEventListener('click',()=>{
  audioCtx.resume();
  gameActive=true;
  if(!gameStartTime){
    gameStartTime=performance.now();totalPausedMs=0;pauseStartTime=null;cycleStartElapsed=0;
    resetTrafficCars();
  }
  startOverlay.style.display='none';
  playBgm('freeway1'); // engine BGM always on
  loadHeavyModels();
});

// ─────────────────────────────────────────────
//  ANIMATION LOOP
// ─────────────────────────────────────────────
let lastT=performance.now();
const _fVec=new THREE.Vector3(), _rVec=new THREE.Vector3();

function getEffectiveYaw(){ return yaw; }

function updateMovement(dt){
  if(!gameActive) return;

  // Left-right slider: rate-based steering (right slider = right turn = decrease yaw)
  // Max 2.2 rad/s → full U-turn in ~1.4s
  const steerVal = +lrSlider.value / 100; // -1 to 1
  yaw += -steerVal * 2.2 * dt;

  const effYaw=getEffectiveYaw();
  updateCruiseBgm();

  // Update cruise from slider (continuous sync)
  cruiseSpeed=+speedSlider.value/100*MAX_CRUISE;

  if(cruiseSpeed>0){
    if(autoPilot){
      camera.position.z-=cruiseSpeed*dt;
      camera.position.x+=(AP_TARGET_X-camera.position.x)*Math.min(.5*dt,1);
    } else {
      _fVec.set(0,0,-1).applyEuler(new THREE.Euler(0,effYaw,0));
      _fVec.y=0; _fVec.normalize();
      camera.position.x+=_fVec.x*cruiseSpeed*dt;
      camera.position.z+=_fVec.z*cruiseSpeed*dt;
    }
  }

  camera.position.x=Math.max(PLAY_X_MIN+PLAYER_R,Math.min(PLAY_X_MAX-PLAYER_R,camera.position.x));
  if(camera.position.z<=PLAY_Z_MIN){camera.position.z+=LOOP_LENGTH;handleLoopTransition();}

  // Rock shake
  const now2=performance.now(), dt2=Math.min((now2-shakeT0)/1000,.05); shakeT0=now2;
  const onRocks=Math.abs(camera.position.x)>2.1, kmh=cruiseSpeed/MAX_CRUISE*120;
  if(onRocks&&kmh>=80){shakePhase=(shakePhase+dt2*18)%2;pitchShake=-(0.625*Math.PI/180)*(1-Math.cos(Math.PI*shakePhase))/2;}
  else{shakePhase=0;pitchShake*=.85;}

  camera.position.y=EYE_HEIGHT;
  camera.rotation.set(pitch+pitchShake,effYaw,0);
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min((now-lastT)/1000,.05); lastT=now;
  const prevZ=camera.position.z;
  updateMovement(dt);
  playerZDeltaFrame=prevZ-camera.position.z;
  if(playerZDeltaFrame<-LOOP_LENGTH/2)playerZDeltaFrame+=LOOP_LENGTH;
  updateAllTrafficCars(dt);

  for(const ring of mountainRings){
    ring.position.x=camera.position.x; ring.position.z=camera.position.z;
    ring.visible=!skyIsBlack;
  }
  extDesertPlane.position.x=camera.position.x;

  const sp=.025;
  skyUniforms.topColor.value.lerp(skyTopTarget,sp);
  skyUniforms.horizonColor.value.lerp(skyHorizTarget,sp);
  skyUniforms.horizonBandColor.value.lerp(skyHorizBandTarget,sp);
  scene.fog.color.lerp(skyHorizTarget,sp);
  skyMesh.position.copy(camera.position);

  window._updateRain();
  window._updateStars();

  if(gameActive){
    hudSpeedEl.textContent=Math.round(cruiseSpeed/MAX_CRUISE*120);
  }

  renderer.render(scene,camera);
}

onResize();
animate();
</script>
</body>
</html>
