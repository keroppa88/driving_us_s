<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driving US</title>
<style>
* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Courier New', monospace;
}

/* ── GameBoy body ── */
#gameboy {
  width:  min(100vw, calc(100vh * 0.565));
  height: min(100vh, calc(100vw / 0.565));
  background: linear-gradient(160deg, #d4cfb8 0%, #c4bfa8 60%, #b8b39e 100%);
  border-radius: 22px 22px 48px 48px;
  box-shadow:
    inset 2px 3px 10px rgba(255,255,255,0.55),
    inset -2px -3px 8px  rgba(0,0,0,0.25),
    6px 10px 28px rgba(0,0,0,0.65),
    0 2px 4px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  padding: 14px 14px 18px;
  gap: 10px;
  position: relative;
}

/* ── Screen wrapper ── */
#screen-wrapper {
  flex: 0 0 61%;
  background: #1e1e1e;
  border-radius: 14px;
  padding: 7px;
  box-shadow:
    inset 4px 4px 14px rgba(0,0,0,0.85),
    inset -1px -1px 4px rgba(255,255,255,0.08),
    0 2px 6px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
  cursor: crosshair;
  touch-action: none;
}
#screen-wrapper::before {
  content: '';
  position: absolute;
  inset: 5px;
  border-radius: 9px;
  background: #0d1a0d;
  z-index: 0;
}

#gameCanvas {
  width: 100%; height: 100%;
  display: block;
  border-radius: 9px;
  position: relative;
  z-index: 1;
  filter: sepia(0.12) saturate(0.88) brightness(0.93);
}

/* crosshair */
#crosshair {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: rgba(190,215,190,0.65);
  font-size: 20px;
  font-weight: 100;
  pointer-events: none;
  z-index: 6;
  text-shadow: 0 0 8px rgba(80,200,80,0.3);
  line-height: 1;
}

/* HUD overlay */
#hud {
  position: absolute;
  top: 10px; left: 12px; right: 12px;
  display: flex;
  justify-content: space-between;
  z-index: 10;
  pointer-events: none;
  font-size: clamp(7px,1.9vw,10px);
  color: rgba(185,215,185,0.92);
  text-shadow: 0 0 6px rgba(0,220,0,0.35);
  letter-spacing: 0.04em;
}

/* ── Controls area ── */
#controls {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#controls-mid {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── D-pad housing ── */
#dpad-housing {
  width: clamp(88px,30%,122px);
  aspect-ratio: 1;
  flex-shrink: 0;
  background: linear-gradient(145deg, #2e2e2e, #1a1a1a);
  border-radius: 18px;
  padding: 9%;
  box-shadow:
    3px 3px 8px rgba(0,0,0,0.6),
    -1px -1px 4px rgba(255,255,255,0.12),
    inset 1px 1px 3px rgba(255,255,255,0.08);
}

/* D-pad grid */
#dpad {
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  grid-template-rows:    1fr 1.1fr 1fr;
  gap: 2px;
}
.dpad-btn {
  background: linear-gradient(145deg, #2a2a2a, #111);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.08s, box-shadow 0.08s;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.5), -1px -1px 2px rgba(255,255,255,0.08);
}
.dpad-btn.pressed, .dpad-btn:active {
  background: linear-gradient(145deg, #111, #2a2a2a);
  box-shadow: inset 2px 2px 5px rgba(0,0,0,0.7);
}
.dpad-arrow { color: #888; font-size: clamp(8px,2.5vw,12px); pointer-events: none; }
#dpad-up    { grid-area: 1/2; border-radius: 5px 5px 2px 2px; }
#dpad-left  { grid-area: 2/1; border-radius: 5px 2px 2px 5px; }
#dpad-center{ grid-area: 2/2; border-radius: 4px; background: #1a1a1a; }
#dpad-right { grid-area: 2/3; border-radius: 2px 5px 5px 2px; }
#dpad-down  { grid-area: 3/2; border-radius: 2px 2px 5px 5px; }
#dpad-corner-tl { grid-area: 1/1; background: transparent !important; box-shadow: none !important; }
#dpad-corner-tr { grid-area: 1/3; background: transparent !important; box-shadow: none !important; }
#dpad-corner-bl { grid-area: 3/1; background: transparent !important; box-shadow: none !important; }
#dpad-corner-br { grid-area: 3/3; background: transparent !important; box-shadow: none !important; }

/* ── Sliders ── */
#sliders-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  justify-content: center;
}
.slider-panel {
  background: linear-gradient(160deg, #b8b49e, #a8a490);
  border-radius: 12px;
  padding: 5px 10px 4px;
  box-shadow:
    inset 3px 3px 7px rgba(0,0,0,0.28),
    inset -1px -1px 3px rgba(255,255,255,0.32),
    1px 1px 3px rgba(255,255,255,0.15);
}
.tick-row {
  height: 8px;
  display: flex;
  align-items: flex-end;
  gap: 0;
  padding: 0 2px;
  margin-bottom: 2px;
}
.tick-row::before {
  content: '';
  display: block;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    to right,
    #888 0px, #888 1px,
    transparent 1px, transparent 7px
  );
  background-size: calc(100% / 13) 100%;
}
input[type="range"] {
  width: 100%;
  height: 22px;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 5px;
  background: linear-gradient(to right, #666, #777);
  border-radius: 3px;
  box-shadow: inset 1px 1px 4px rgba(0,0,0,0.5);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px; height: 26px;
  background: linear-gradient(145deg, #555, #1e1e1e);
  border-radius: 5px;
  margin-top: -10px;
  box-shadow: 2px 2px 6px rgba(0,0,0,0.55), -1px -1px 2px rgba(255,255,255,0.18);
  cursor: grab;
}
input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; }
input[type="range"]::-moz-range-track {
  height: 5px;
  background: linear-gradient(to right, #666, #777);
  border-radius: 3px;
}
input[type="range"]::-moz-range-thumb {
  width: 26px; height: 26px;
  background: linear-gradient(145deg, #555, #1e1e1e);
  border-radius: 5px;
  border: none;
  box-shadow: 2px 2px 6px rgba(0,0,0,0.55);
}
.slider-label {
  text-align: center;
  font-size: clamp(7px,1.8vw,9px);
  color: #5a5848;
  letter-spacing: 0.05em;
  margin-top: 1px;
}

/* ── Bottom buttons ── */
#buttons-row {
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  padding: 0 2px;
}
.action-btn-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.action-btn {
  width: clamp(38px,12.5vw,54px);
  height: clamp(38px,12.5vw,54px);
  border-radius: 50%;
  border: none;
  background: linear-gradient(145deg, #2e2e2e, #111);
  box-shadow:
    3px 3px 8px rgba(0,0,0,0.55),
    -1px -1px 3px rgba(255,255,255,0.12),
    inset 1px 1px 2px rgba(255,255,255,0.08);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  color: #888;
}
.action-btn:active {
  box-shadow: inset 2px 2px 7px rgba(0,0,0,0.7), 1px 1px 3px rgba(0,0,0,0.4);
  transform: scale(0.94);
}
.action-btn.active { color: #6aba6a; }
.action-btn svg { width: 44%; height: 44%; }
.btn-label {
  font-size: clamp(5.5px,1.5vw,8.5px);
  color: #5a5848;
  text-align: center;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

/* tilt indicator dot */
#tilt-dot {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(100,220,100,0.7);
  box-shadow: 0 0 6px rgba(0,220,0,0.5);
  pointer-events: none;
  z-index: 8;
  transform: translate(-50%,-50%);
  transition: left 0.1s, top 0.1s;
}
</style>
</head>
<body>
<div id="gameboy">

  <!-- ── Screen ── -->
  <div id="screen-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair">+</div>
    <div id="tilt-dot"></div>
    <div id="hud">
      <span>DIST:&nbsp;<span id="hud-dist">0000</span>m</span>
      <span>SPEED:&nbsp;<span id="hud-speed">0</span>km/h</span>
      <span>AUTO:&nbsp;<span id="hud-auto">OFF</span></span>
    </div>
  </div>

  <!-- ── Controls ── -->
  <div id="controls">
    <div id="controls-mid">

      <!-- D-pad -->
      <div id="dpad-housing">
        <div id="dpad">
          <div id="dpad-corner-tl"></div>
          <div id="dpad-up"     class="dpad-btn" data-dir="up">   <span class="dpad-arrow">▲</span></div>
          <div id="dpad-corner-tr"></div>
          <div id="dpad-left"   class="dpad-btn" data-dir="left"> <span class="dpad-arrow">◀</span></div>
          <div id="dpad-center" class="dpad-btn" data-dir="center"><span class="dpad-arrow" style="color:#555">●</span></div>
          <div id="dpad-right"  class="dpad-btn" data-dir="right"><span class="dpad-arrow">▶</span></div>
          <div id="dpad-corner-bl"></div>
          <div id="dpad-down"   class="dpad-btn" data-dir="down"> <span class="dpad-arrow">▼</span></div>
          <div id="dpad-corner-br"></div>
        </div>
      </div>

      <!-- Sliders -->
      <div id="sliders-area">
        <div class="slider-panel">
          <div class="tick-row"></div>
          <input type="range" id="lr-slider" min="-100" max="100" value="0">
          <div class="slider-label">左右操作</div>
        </div>
        <div class="slider-panel">
          <div class="tick-row"></div>
          <input type="range" id="speed-slider" min="0" max="100" value="50">
          <div class="slider-label">スピード</div>
        </div>
      </div>
    </div><!-- /controls-mid -->

    <!-- Bottom buttons -->
    <div id="buttons-row">
      <!-- Play/Stop -->
      <div class="action-btn-wrap">
        <button class="action-btn active" id="btn-play">
          <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon">
            <rect x="6"  y="5" width="4" height="14" rx="1"/>
            <rect x="14" y="5" width="4" height="14" rx="1"/>
          </svg>
        </button>
        <span class="btn-label">再生・停止</span>
      </div>
      <!-- HUD toggle -->
      <div class="action-btn-wrap">
        <button class="action-btn active" id="btn-hud">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <span class="btn-label">表示・非表示</span>
      </div>
      <!-- Auto drive -->
      <div class="action-btn-wrap">
        <button class="action-btn" id="btn-auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="7" rx="2"/>
            <path d="M5 11l2-5h10l2 5"/>
            <circle cx="7.5" cy="15.5" r="1.5" fill="currentColor" stroke="none"/>
            <circle cx="16.5" cy="15.5" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <span class="btn-label">自動運転</span>
      </div>
      <!-- Sound -->
      <div class="action-btn-wrap">
        <button class="action-btn active" id="btn-sound">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3z"/>
            <path d="M16.5 12A4.5 4.5 0 0014 7.97v8.06c1.48-.73 2.5-2.25 2.5-4.03z" opacity="0.7"/>
          </svg>
        </button>
        <span class="btn-label">音量設定</span>
      </div>
      <!-- Fullscreen -->
      <div class="action-btn-wrap">
        <button class="action-btn" id="btn-fs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M3 16v3a2 2 0 002 2h3"/>
          </svg>
        </button>
        <span class="btn-label">全画面</span>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ─────────────────────────────────────────────
//  THREE.JS SCENE
// ─────────────────────────────────────────────
const canvas  = document.getElementById('gameCanvas');
const wrapper = document.getElementById('screen-wrapper');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene  = new THREE.Scene();
const SKY_COLOR = new THREE.Color(0x7aa8c4);
scene.background = SKY_COLOR;
scene.fog = new THREE.FogExp2(SKY_COLOR, 0.0065);

const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 600);
camera.position.set(0, 2.2, 0);

function resizeRenderer() {
  const W = wrapper.clientWidth, H = wrapper.clientHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);
resizeRenderer();

// --- Lighting ---
const sun = new THREE.DirectionalLight(0xfff6e0, 1.15);
sun.position.set(80, 130, -60);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x5577aa, 0.65));

// --- Sky sphere (gradient) ---
const skyGeo = new THREE.SphereGeometry(500, 16, 8);
const skyVColors = [];
const skyPos = skyGeo.attributes.position;
for (let i = 0; i < skyPos.count; i++) {
  const t = Math.max(0, Math.min(1, (skyPos.getY(i) + 500) / 1000));
  // horizon #7aa8c4 → zenith #3b6fa0
  skyVColors.push(
    0x7a/255 + (0x3b/255 - 0x7a/255)*t,
    0xa8/255 + (0x6f/255 - 0xa8/255)*t,
    0xc4/255 + (0xa0/255 - 0xc4/255)*t
  );
}
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyVColors, 3));
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));

// --- Ground ---
scene.add(Object.assign(
  new THREE.Mesh(
    new THREE.PlaneGeometry(900, 900),
    new THREE.MeshLambertMaterial({ color: 0xb8935a })
  ),
  { rotation: { x: -Math.PI/2, y: 0, z: 0 }, position: { x: 0, y: -0.02, z: -200 } }
));

// Distant flat-ish hills
(function addHills() {
  const matH = new THREE.MeshLambertMaterial({ color: 0xc8b888 });
  const matS = new THREE.MeshLambertMaterial({ color: 0xe8e4d8 });
  const defs = [
    [-110,-320, 65,22,42], [-45,-340, 48,20,36], [90,-310, 72,24,48],
    [170,-295, 54,18,40], [-175,-280, 58,20,44], [10,-355, 50,23,42],
    [260,-305, 62,17,38], [-260,-300, 55,21,46],
  ];
  for (const [x,z,rx,ry,rz] of defs) {
    const geo = new THREE.SphereGeometry(1,12,8,0,Math.PI*2,0,Math.PI/2);
    const h = new THREE.Mesh(geo, matH);
    h.position.set(x,0,z); h.scale.set(rx,ry,rz);
    scene.add(h);
    const sg = new THREE.SphereGeometry(1,12,8,0,Math.PI*2,0,Math.PI/3);
    const s = new THREE.Mesh(sg, matS);
    s.position.set(x, ry*0.58, z); s.scale.set(rx*0.52,ry*0.62,rz*0.52);
    scene.add(s);
  }
})();

// Scattered bushes & rocks
(function addScatter() {
  const mB = new THREE.MeshLambertMaterial({ color: 0x7a7a55 });
  const mR = new THREE.MeshLambertMaterial({ color: 0x8a8068 });
  for (let i = 0; i < 220; i++) {
    const z = -Math.random()*380 - 20;
    const side = Math.random()>.5 ? 1 : -1;
    const x = side*(13 + Math.random()*55);
    if (Math.random() > 0.38) {
      const sz = 0.28 + Math.random()*0.75;
      const m = new THREE.Mesh(new THREE.SphereGeometry(sz,5,4), mB);
      m.position.set(x, sz*0.35, z); m.scale.y = 0.48;
      scene.add(m);
    } else {
      const sz = 0.18 + Math.random()*0.45;
      const m = new THREE.Mesh(new THREE.DodecahedronGeometry(sz,0), mR);
      m.position.set(x, sz*0.28, z); m.rotation.y = Math.random()*Math.PI;
      scene.add(m);
    }
  }
})();

// --- Road ---
scene.add(Object.assign(
  new THREE.Mesh(new THREE.PlaneGeometry(9,900), new THREE.MeshLambertMaterial({ color: 0x6a6a6a })),
  { rotation: { x:-Math.PI/2,y:0,z:0 }, position:{ x:0,y:0,z:-450 } }
));
// shoulders
for (const sx of [-4.85, 4.85]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.55,900), new THREE.MeshLambertMaterial({ color:0x888880 }));
  m.rotation.x=-Math.PI/2; m.position.set(sx,0.001,-450);
  scene.add(m);
}

// Center dashes (recycled)
const DASH_COUNT = 70, DASH_GAP = 9;
const dashMat = new THREE.MeshLambertMaterial({ color: 0xe8e8d8 });
const dashes = [];
for (let i = 0; i < DASH_COUNT; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.14,3.2), dashMat);
  m.rotation.x = -Math.PI/2; m.position.set(0, 0.002, -i*DASH_GAP);
  dashes.push(m); scene.add(m);
}

// Power poles (recycled)
const POLE_COUNT = 22, POLE_SPACING = 28;
const poleMat = new THREE.MeshLambertMaterial({ color: 0x6a4e2a });
const insMat  = new THREE.MeshLambertMaterial({ color: 0x8888aa });
const poles = [];
for (let i = 0; i < POLE_COUNT; i++) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.12,8,6), poleMat);
  pole.position.y = 4; g.add(pole);
  const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,3.2,5), poleMat);
  cross.rotation.z = Math.PI/2; cross.position.y = 7.4; g.add(cross);
  for (const ix of [-1.3,0,1.3]) {
    const ins = new THREE.Mesh(new THREE.SphereGeometry(0.1,4,3), insMat);
    ins.position.set(ix,7.4,0); g.add(ins);
  }
  g.position.set(6.2, 0, -i*POLE_SPACING);
  poles.push(g); scene.add(g);
}

// ─────────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────────
const state = {
  speed: 50,        // slider 0-100
  lrSlider: 0,      // -100..100
  playing: true,
  auto: false,
  yaw: 0,           // camera horizontal angle (rad)
  pitch: 0,         // camera vertical angle (rad)
  tiltLR: 0,        // device orientation -1..1
  touchYaw: 0,      // touch drag contribution
  touchPitch: 0,
  dist: 0,
  dpad: { up:false, down:false, left:false, right:false },
};

// ─────────────────────────────────────────────
//  TOUCH ON SCREEN → CAMERA DRAG
// ─────────────────────────────────────────────
let touchStartX = 0, touchStartY = 0;
let touchActive = false;
const DRAG_YAW_SCALE   = 0.004;
const DRAG_PITCH_SCALE = 0.003;
let dragYawAcc = 0, dragPitchAcc = 0;

wrapper.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

wrapper.addEventListener('touchmove', e => {
  if (!touchActive || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  dragYawAcc   += dx * DRAG_YAW_SCALE;
  dragPitchAcc += dy * DRAG_PITCH_SCALE;
}, { passive: true });

wrapper.addEventListener('touchend',    () => { touchActive = false; });
wrapper.addEventListener('touchcancel', () => { touchActive = false; });

// Mouse drag (desktop testing)
let mouseDown = false, mouseLastX = 0, mouseLastY = 0;
wrapper.addEventListener('mousedown', e => { mouseDown=true; mouseLastX=e.clientX; mouseLastY=e.clientY; });
window.addEventListener('mouseup',   () => { mouseDown=false; });
window.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  const dx = e.clientX - mouseLastX;
  const dy = e.clientY - mouseLastY;
  mouseLastX = e.clientX; mouseLastY = e.clientY;
  dragYawAcc   += dx * DRAG_YAW_SCALE;
  dragPitchAcc += dy * DRAG_PITCH_SCALE;
});

// ─────────────────────────────────────────────
//  DEVICE ORIENTATION (TILT)
// ─────────────────────────────────────────────
let orientReady = false;
function startOrientation() {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma != null) state.tiltLR = Math.max(-1, Math.min(1, e.gamma / 40));
  });
  orientReady = true;
}
if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function') {
  document.body.addEventListener('touchstart', () => {
    if (!orientReady)
      DeviceOrientationEvent.requestPermission().then(s => { if (s==='granted') startOrientation(); });
  }, { once: true });
} else {
  startOrientation();
}

// Tilt dot indicator
const tiltDot = document.getElementById('tilt-dot');
function updateTiltDot() {
  const W = wrapper.clientWidth, H = wrapper.clientHeight;
  const x = W/2 + state.tiltLR * W * 0.35;
  const y = H * 0.5;
  tiltDot.style.left = x + 'px';
  tiltDot.style.top  = y + 'px';
  tiltDot.style.opacity = Math.abs(state.tiltLR) > 0.05 ? '0.8' : '0';
}

// ─────────────────────────────────────────────
//  D-PAD
// ─────────────────────────────────────────────
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  if (!dir || dir==='center') return;
  const on  = () => { state.dpad[dir]=true;  btn.classList.add('pressed'); };
  const off = () => { state.dpad[dir]=false; btn.classList.remove('pressed'); };
  btn.addEventListener('mousedown',    on);
  btn.addEventListener('touchstart', e => { e.preventDefault(); on(); }, { passive: false });
  btn.addEventListener('mouseup',    off);
  btn.addEventListener('mouseleave', off);
  btn.addEventListener('touchend',   off);
  btn.addEventListener('touchcancel',off);
});

// ─────────────────────────────────────────────
//  SLIDERS
// ─────────────────────────────────────────────
document.getElementById('lr-slider').addEventListener('input', e => {
  state.lrSlider = +e.target.value;
});
document.getElementById('speed-slider').addEventListener('input', e => {
  state.speed = +e.target.value;
});

// ─────────────────────────────────────────────
//  BUTTONS
// ─────────────────────────────────────────────
const btnPlay  = document.getElementById('btn-play');
const btnHud   = document.getElementById('btn-hud');
const btnAuto  = document.getElementById('btn-auto');
const btnSound = document.getElementById('btn-sound');
const btnFs    = document.getElementById('btn-fs');
const hudEl    = document.getElementById('hud');

btnPlay.addEventListener('click', () => {
  state.playing = !state.playing;
  btnPlay.classList.toggle('active', state.playing);
  document.getElementById('play-icon').innerHTML = state.playing
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M8 5v14l11-7z"/>';
});

btnHud.addEventListener('click', () => {
  const vis = hudEl.style.visibility !== 'hidden';
  hudEl.style.visibility = vis ? 'hidden' : '';
  btnHud.classList.toggle('active', !vis);
});

btnAuto.addEventListener('click', () => {
  state.auto = !state.auto;
  btnAuto.classList.toggle('active', state.auto);
  document.getElementById('hud-auto').textContent = state.auto ? 'ON' : 'OFF';
});

let soundOn = true;
btnSound.addEventListener('click', () => {
  soundOn = !soundOn;
  btnSound.classList.toggle('active', soundOn);
});

btnFs.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)
      .call(document.documentElement);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
  btnFs.classList.toggle('active');
});

// ─────────────────────────────────────────────
//  ANIMATION LOOP
// ─────────────────────────────────────────────
const PITCH_MIN = -0.18, PITCH_MAX = 0.35;
let lastT = 0;

function tick(t) {
  requestAnimationFrame(tick);
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  if (state.playing) {
    const kmh  = state.speed * 1.2;            // 0–120 km/h
    const mps  = kmh / 3.6;
    const move = mps * dt;

    state.dist += move;

    // Recycle dashes
    for (const d of dashes) {
      d.position.z += move;
      if (d.position.z > 6) d.position.z -= DASH_COUNT * DASH_GAP;
    }
    // Recycle poles
    for (const p of poles) {
      p.position.z += move;
      if (p.position.z > 16) p.position.z -= POLE_COUNT * POLE_SPACING;
    }

    document.getElementById('hud-speed').textContent = Math.round(kmh);
    document.getElementById('hud-dist').textContent  = String(Math.floor(state.dist)).padStart(4,'0');
  }

  // ── Camera yaw (horizontal) ──
  let targetYaw = 0;
  if (state.auto) {
    targetYaw = Math.sin(state.dist * 0.006) * 0.18;
  } else {
    targetYaw  = state.tiltLR * 0.38;
    targetYaw += (state.lrSlider / 100) * 0.28;
    targetYaw += (state.dpad.left ? -0.22 : 0) + (state.dpad.right ? 0.22 : 0);
  }

  // Consume accumulated drag (inertia-free; snaps toward zero)
  targetYaw += dragYawAcc;
  dragYawAcc   *= 0.82;
  dragPitchAcc *= 0.82;

  state.yaw   += (targetYaw - state.yaw) * 0.1;

  // ── Camera pitch (vertical) ──
  let targetPitch = 0.05;                      // slight downward look baseline
  targetPitch += (state.dpad.up   ? -0.1 : 0);
  targetPitch += (state.dpad.down ?  0.08: 0);
  targetPitch += dragPitchAcc;
  targetPitch  = Math.max(PITCH_MIN, Math.min(PITCH_MAX, targetPitch));
  state.pitch += (targetPitch - state.pitch) * 0.1;

  // Apply to camera lookAt
  const lookDist = 50;
  camera.lookAt(
    Math.sin(state.yaw)  * lookDist,
    1.4 - state.pitch * lookDist,
    -lookDist
  );

  updateTiltDot();
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
